name: Apply authentic classic adventure polish v2

on:
  push:
    branches:
      - agent/authentic-classic-polish-20260809

concurrency:
  group: authentic-classic-polish-v2-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  BASE_SHA: 395f76e094fdd5965a738cdc00c16d692f55bf7a
  BRANCH_NAME: agent/authentic-classic-polish-20260809
  BUNDLE_SHA256: 8e9474609f03128e2b6399931c566a5ce6377361e520b9927321c37c72e2010b

jobs:
  apply-verify-and-commit:
    if: "${{ github.event.head_commit.message != 'feat: add authentic classic adventure polish' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out guarded branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify guarded staging inputs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "acb392f130d494c377fa79d3e3f7f30d15ba5084"
          test -f .agent-release/part-00
          test -f .agent-release/part-08
          test -f .github/guarded-authentic-polish-fix.py
          test -f .github/workflows/apply-authentic-polish-v2.yml

      - name: Reconstruct sealed source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-release/part-* | base64 --decode > /tmp/authentic-polish.tar.xz
          echo "$BUNDLE_SHA256  /tmp/authentic-polish.tar.xz" | sha256sum --check --strict
          rm -rf /tmp/authentic-polish
          mkdir -p /tmp/authentic-polish
          tar -xJf /tmp/authentic-polish.tar.xz -C /tmp/authentic-polish
          test -f /tmp/authentic-polish/authentic-polish-bundle-lite/APPLY_AUTHENTIC_POLISH.mjs

      - name: Set up deterministic Python toolchain
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install indexed-art generator dependency
        run: python3 -m pip install --disable-pip-version-check --no-input Pillow==12.3.0

      - name: Generate exact source and native indexed assets
        shell: bash
        run: |
          set -euo pipefail
          cp .github/guarded-authentic-polish-fix.py /tmp/guarded-authentic-polish-fix.py
          node /tmp/authentic-polish/authentic-polish-bundle-lite/APPLY_AUTHENTIC_POLISH.mjs \
            /tmp/authentic-polish/authentic-polish-bundle-lite \
            . | tee /tmp/authentic-polish-apply.log
          grep -F '"changedPaths": 55' /tmp/authentic-polish-apply.log
          grep -F '"indexedAssets": 17' /tmp/authentic-polish-apply.log
          python3 /tmp/guarded-authentic-polish-fix.py
          rm -rf .agent-release
          rm -f .github/guarded-authentic-polish-fix.py
          rm -f .github/workflows/apply-authentic-polish.yml
          rm -f .github/workflows/apply-authentic-polish-v2.yml
          LC_ALL=C sort -u /tmp/authentic-polish-paths.txt > /tmp/authentic-polish-expected-paths.txt

      - name: Verify exact feature scope before toolchain work
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only "$BASE_SHA"; git ls-files --others --exclude-standard; } \
            | LC_ALL=C sort -u > /tmp/authentic-polish-actual-paths.txt
          diff -u /tmp/authentic-polish-expected-paths.txt /tmp/authentic-polish-actual-paths.txt
          test ! -e .agent-release
          test ! -e .github/guarded-authentic-polish-fix.py
          test ! -e .github/workflows/apply-authentic-polish.yml
          test ! -e .github/workflows/apply-authentic-polish-v2.yml
          git diff --check

      - name: Set up exact Node toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install exact pnpm toolchain and workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.17.0
          node --version
          pnpm --version
          pnpm install --lockfile=false

      - name: Verify pinned repository toolchain
        run: pnpm run check:toolchain

      - name: Canonically format and lint changed source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t BIOME_PATHS < /tmp/authentic-polish-biome-paths.txt
          pnpm exec biome check --write "${BIOME_PATHS[@]}"
          pnpm exec biome check "${BIOME_PATHS[@]}"
          git diff --check

      - name: Verify changed text-file hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          paths = [
              Path(line)
              for line in Path('/tmp/authentic-polish-text-paths.txt')
              .read_text(encoding='utf-8')
              .splitlines()
              if line
          ]
          failures: list[str] = []
          for path in paths:
              data = path.read_bytes()
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  failures.append(f'{path}: not UTF-8')
                  continue
              if b'\r' in data:
                  failures.append(f'{path}: CR line ending')
              if text and not text.endswith('\n'):
                  failures.append(f'{path}: missing final newline')
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if line.rstrip(' \t') != line:
                      failures.append(f'{path}:{line_number}: trailing whitespace')
          if failures:
              raise SystemExit('\n'.join(failures))
          print(f'Verified {len(paths)} changed text files.')
          PY

      - name: Validate canonical Red Ledger runtime source
        run: node scripts/validate-red-ledger-runtime.mjs

      - name: Bootstrap workspace outputs and capture existing monorepo debt
        shell: bash
        run: |
          set +e
          pnpm exec tsc -b --pretty false --force > /tmp/authentic-polish-tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/authentic-polish-tsc.log
          echo "Repository-wide TypeScript bootstrap status: $status"

      - name: Reject non-cascading TypeScript errors in changed files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const changed = new Set(
            fs
              .readFileSync('/tmp/authentic-polish-expected-paths.txt', 'utf8')
              .trim()
              .split(/\r?\n/u),
          );
          const ignoredCascadeCodes = new Set(['TS2305', 'TS2307', 'TS7006']);
          const diagnostics = fs
            .readFileSync('/tmp/authentic-polish-tsc.log', 'utf8')
            .split(/\r?\n/u)
            .flatMap((line) => {
              const match = line.match(/^(.+?)\((\d+),(\d+)\): error (TS\d+): (.+)$/u);
              if (!match) return [];
              const [, path, lineNumber, column, code, message] = match;
              if (!path || !code || !changed.has(path) || ignoredCascadeCodes.has(code)) {
                return [];
              }
              return [{ path, lineNumber, column, code, message }];
            });
          if (diagnostics.length > 0) {
            for (const diagnostic of diagnostics) {
              console.error(
                `${diagnostic.path}(${diagnostic.lineNumber},${diagnostic.column}): ` +
                  `${diagnostic.code}: ${diagnostic.message}`,
              );
            }
            process.exit(1);
          }
          console.log('Changed files contain no non-cascading TypeScript diagnostics.');
          NODE

      - name: Run focused authenticity, runtime, and editor regressions
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            packages/adventure-design/tests/classic-experience.test.ts \
            packages/renderer-pixi/tests/pixel-presentation.test.ts \
            packages/project-schema/tests/project-schema.test.ts \
            packages/project-editor-core/tests/project-editor.test.ts \
            packages/scene-runtime/tests/scene-transition.test.ts \
            apps/player/tests/built-in-demos.test.ts \
            apps/player/tests/red-ledger-playable-slice.test.mjs \
            packages/adventure-design/tests/red-ledger-runtime.test.mjs \
            --reporter=verbose

      - name: Build production Player and Studio applications
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @evavo/adventure-player build
          pnpm --filter @evavo/adventure-studio-app build

      - name: Verify final publication scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          { git diff --name-only "$BASE_SHA"; git ls-files --others --exclude-standard; } \
            | LC_ALL=C sort -u > /tmp/authentic-polish-actual-paths.txt
          diff -u /tmp/authentic-polish-expected-paths.txt /tmp/authentic-polish-actual-paths.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: authentic-polish-v2-diagnostics-${{ github.run_number }}
          path: |
            /tmp/authentic-polish-apply.log
            /tmp/authentic-polish-tsc.log
            /tmp/authentic-polish-actual-paths.txt
            /tmp/authentic-polish-expected-paths.txt
            /tmp/authentic-polish-biome-paths.txt
            /tmp/authentic-polish-text-paths.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit verified feature to guarded branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO Release Agent"
          git config user.email "release-agent@evavo.com.au"
          git add -A
          git diff --cached --name-only "$BASE_SHA" | LC_ALL=C sort -u \
            > /tmp/authentic-polish-staged-paths.txt
          diff -u /tmp/authentic-polish-expected-paths.txt /tmp/authentic-polish-staged-paths.txt
          git commit -m "feat: add authentic classic adventure polish"
          git push origin "HEAD:$BRANCH_NAME"
