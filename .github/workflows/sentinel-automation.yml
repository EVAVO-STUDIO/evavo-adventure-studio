name: Adventure Studio Diagnostic Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification depth
        required: true
        default: focused
        type: choice
        options:
          - source
          - focused
          - full

concurrency:
  group: adventure-studio-diagnostic-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pinned pnpm and workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.17.0
          pnpm install --lockfile=false

      - name: Verify source contract
        if: inputs.mode == 'source'
        run: pnpm run source:check

      - name: Verify classic-adventure production slice
        if: inputs.mode == 'focused'
        shell: bash
        run: |
          set -euo pipefail
          pnpm run check:toolchain
          pnpm exec biome ci \
            packages/adventure-design/src \
            packages/adventure-design/tests \
            packages/renderer-pixi/src \
            packages/renderer-pixi/tests \
            apps/studio/src \
            apps/player/src
          pnpm exec tsc -b --pretty false
          pnpm exec vitest run \
            packages/adventure-design/tests/classic-experience.test.ts \
            packages/renderer-pixi/tests/pixel-presentation.test.ts \
            packages/scene-runtime/tests/scene-transition.test.ts \
            apps/player/tests/red-ledger-playable-slice.test.mjs \
            packages/adventure-design/tests/red-ledger-runtime.test.mjs
          node scripts/validate-red-ledger-runtime.mjs
          pnpm run build:player
          pnpm run build:studio

      - name: Verify complete repository
        if: inputs.mode == 'full'
        run: pnpm run check:ci
