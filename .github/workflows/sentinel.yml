name: Nightly Adventure Studio Verification

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-adventure-studio-verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pinned pnpm and workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.17.0
          pnpm install --lockfile=false

      - name: Verify pinned toolchain
        run: pnpm run check:toolchain

      - name: Run repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome ci .
          pnpm exec tsc -b --pretty false
          pnpm exec vitest run
          pnpm run build:player
          pnpm run build:studio
