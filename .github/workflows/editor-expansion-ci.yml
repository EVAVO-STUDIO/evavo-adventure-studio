name: Editor Expansion CI

on:
  push:
    branches: [main]
    paths:
      - "packages/dialogue-editor-core/**"
      - "packages/sequence-editor-core/**"
      - "packages/narrative-library-editor-core/**"
      - "packages/animation-editor-core/**"
      - "packages/art-direction/**"
      - "packages/bitmap-font/**"
      - "packages/bitmap-font-editor-core/**"
      - "packages/ui-skin/**"
      - "packages/ui-skin-editor-core/**"
      - "packages/save-game/**"
      - "packages/replay/**"
      - "packages/asset-pipeline/**"
      - "packages/project-editor-core/**"
      - "packages/editor-core/**"
      - "packages/render-contract/**"
      - "packages/renderer-pixi/**"
      - "packages/runtime-bundle/**"
      - "packages/compiler/**"
      - "apps/player/**"
      - "apps/studio/**"
      - "apps/timeline-lab/**"
      - "tools/cli/**"
      - "tsconfig.editor-expansion.json"
      - ".github/workflows/editor-expansion-ci.yml"
  pull_request:
    paths:
      - "packages/dialogue-editor-core/**"
      - "packages/sequence-editor-core/**"
      - "packages/narrative-library-editor-core/**"
      - "packages/animation-editor-core/**"
      - "packages/art-direction/**"
      - "packages/bitmap-font/**"
      - "packages/bitmap-font-editor-core/**"
      - "packages/ui-skin/**"
      - "packages/ui-skin-editor-core/**"
      - "packages/save-game/**"
      - "packages/replay/**"
      - "packages/asset-pipeline/**"
      - "packages/project-editor-core/**"
      - "packages/editor-core/**"
      - "packages/render-contract/**"
      - "packages/renderer-pixi/**"
      - "packages/runtime-bundle/**"
      - "packages/compiler/**"
      - "apps/player/**"
      - "apps/studio/**"
      - "apps/timeline-lab/**"
      - "tools/cli/**"
      - "tsconfig.editor-expansion.json"
      - ".github/workflows/editor-expansion-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-expansion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify editor expansion (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check editor expansion graph
        run: pnpm exec tsc -b tsconfig.editor-expansion.json --pretty false

      - name: Run editor expansion tests
        run: >-
          pnpm exec vitest run
          packages/editor-core/tests
          packages/project-editor-core/tests
          packages/dialogue-editor-core/tests
          packages/sequence-editor-core/tests
          packages/narrative-library-editor-core/tests
          packages/animation-editor-core/tests
          packages/art-direction/tests
          packages/bitmap-font/tests
          packages/bitmap-font-editor-core/tests
          packages/ui-skin/tests
          packages/ui-skin-editor-core/tests
          packages/save-game/tests
          packages/replay/tests
          packages/asset-pipeline/tests/art-evidence.test.ts
          packages/compiler/tests/bitmap-font-compilation.test.ts
          packages/compiler/tests/ui-skin-compilation.test.ts
          packages/runtime-bundle/tests/bitmap-font-runtime.test.ts
          packages/runtime-bundle/tests/ui-skin-runtime.test.ts
          packages/renderer-pixi/tests
          apps/player/tests
          apps/studio/tests
          apps/timeline-lab/tests
          tools/cli/tests

      - name: Build browser player
        run: pnpm --filter @evavo/adventure-player build

      - name: Build main visual studio
        run: pnpm --filter @evavo/adventure-studio-app build

      - name: Build cinematic timeline lab
        run: pnpm --filter @evavo/adventure-timeline-lab build

      - name: Build command-line tools
        run: pnpm --filter @evavo/adventure-cli build
