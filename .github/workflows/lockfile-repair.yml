name: One-use lockfile repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lockfile-repair.yml"

permissions:
  contents: write

concurrency:
  group: lockfile-repair-main
  cancel-in-progress: false

jobs:
  repair:
    name: Regenerate pnpm lockfile
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Regenerate workspace lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm lockfile for audio foundation"
          git push origin HEAD:main
