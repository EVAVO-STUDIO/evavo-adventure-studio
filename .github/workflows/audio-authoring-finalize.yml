name: One-use Audio Studio finalization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audio-authoring-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-authoring-finalize-main
  cancel-in-progress: false

jobs:
  finalize:
    name: Harden and verify Audio Studio
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out main
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: main
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Harden generated audio IDs and cue editing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "apps/studio/src/AudioApp.tsx";
          let source = fs.readFileSync(path, "utf8");
          const replaceOnce = (oldValue, newValue) => {
            if (!source.includes(oldValue)) {
              throw new Error(`Expected AudioApp source fragment is missing: ${oldValue.slice(0, 120)}`);
            }
            source = source.replace(oldValue, newValue);
          };

          replaceOnce("  type AudioBusId,\n", "");
          replaceOnce(
            "const id = <T extends string>(value: string): Id<T> => value as Id<T>;\n\n",
            [
              "const id = <T extends string>(value: string): Id<T> => value as Id<T>;",
              "",
              "const nextStableId = (prefix: string, existing: readonly string[]): string => {",
              "  const used = new Set(existing);",
              "  let suffix = existing.length + 1;",
              "  while (used.has(`${prefix}.${suffix}`)) suffix += 1;",
              "  return `${prefix}.${suffix}`;",
              "};",
              "",
              "",
            ].join("\n"),
          );
          replaceOnce(
            "    const cueId = id<\"audio-cue\">(`audio-cue.custom.${index}`);",
            [
              "    const cueId = id<\"audio-cue\">(",
              "      nextStableId(",
              "        \"audio-cue.custom\",",
              "        manifest.cues.map((candidate) => candidate.id),",
              "      ),",
              "    );",
            ].join("\n"),
          );
          replaceOnce(
            [
              "    const index = soundscape.layers.length + 1;",
              "    execute(",
              "      insertSceneLayerCommand(state, {",
              "        id: id<\"audio-scene-layer\">(",
              "          `audio-scene-layer.${state.selectedSceneId}.${index}`,",
              "        ),",
            ].join("\n"),
            [
              "    const layerId = id<\"audio-scene-layer\">(",
              "      nextStableId(",
              "        `audio-scene-layer.${state.selectedSceneId}`,",
              "        soundscape.layers.map((candidate) => candidate.id),",
              "      ),",
              "    );",
              "    execute(",
              "      insertSceneLayerCommand(state, {",
              "        id: layerId,",
            ].join("\n"),
          );
          replaceOnce(
            [
              "    const bindingId = id<\"audio-speech-binding\">(",
              "      `audio-speech-binding.custom.${manifest.speechBindings.length + 1}`,",
              "    );",
            ].join("\n"),
            [
              "    const bindingId = id<\"audio-speech-binding\">(",
              "      nextStableId(",
              "        \"audio-speech-binding.custom\",",
              "        manifest.speechBindings.map((candidate) => candidate.id),",
              "      ),",
              "    );",
            ].join("\n"),
          );
          replaceOnce(
            [
              "    const ruleId = id<\"audio-ducking-rule\">(",
              "      `audio-ducking-rule.custom.${manifest.ducking.length + 1}`,",
              "    );",
            ].join("\n"),
            [
              "    const ruleId = id<\"audio-ducking-rule\">(",
              "      nextStableId(",
              "        \"audio-ducking-rule.custom\",",
              "        manifest.ducking.map((candidate) => candidate.id),",
              "      ),",
              "    );",
            ].join("\n"),
          );
          replaceOnce(
            "                checked={cue.loop !== null}\n",
            "                checked={cue.loop !== null}\n                disabled={cue.bus === \"speech\"}\n",
          );

          fs.writeFileSync(path, source);
          NODE

      - name: Install exact committed dependency graph
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        run: pnpm exec biome check --write apps/studio/src/AudioApp.tsx

      - name: Verify repository lint
        run: pnpm exec biome ci .

      - name: Run governed editor expansion gate
        run: pnpm run check:editor-expansion

      - name: Commit verified Audio Studio hardening
        shell: bash
        run: |
          if git diff --quiet -- apps/studio/src/AudioApp.tsx; then
            echo "Audio Studio source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/AudioApp.tsx
          git commit -m "fix: harden verified Audio Studio authoring"
          git push origin HEAD:main
