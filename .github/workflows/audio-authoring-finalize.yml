name: One-use Audio Studio finalization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audio-authoring-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-authoring-finalize-main
  cancel-in-progress: false

jobs:
  finalize:
    name: Harden and verify Audio Studio
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out main
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: main
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Activate pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Harden generated audio IDs and editor semantics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "apps/studio/src/AudioApp.tsx";
          let source = fs.readFileSync(path, "utf8");
          const replaceOnce = (oldValue, newValue) => {
            if (!source.includes(oldValue)) {
              throw new Error(`Expected AudioApp source fragment is missing: ${oldValue.slice(0, 120)}`);
            }
            source = source.replace(oldValue, newValue);
          };

          replaceOnce("  type AudioBusId,\n", "");
          replaceOnce(
            "const id = <T extends string>(value: string): Id<T> => value as Id<T>;\n\n",
            [
              "const id = <T extends string>(value: string): Id<T> => value as Id<T>;",
              "",
              "const nextStableId = (prefix: string, existing: readonly string[]): string => {",
              "  const used = new Set(existing);",
              "  let suffix = existing.length + 1;",
              "  while (used.has(`${prefix}.${suffix}`)) suffix += 1;",
              "  return `${prefix}.${suffix}`;",
              "};",
              "",
              "",
            ].join("\n"),
          );
          replaceOnce(
            [
              "}) => (",
              "  <label className={`audio-field${wide ? \" is-wide\" : \"\"}`}>",
              "    <span>{label}</span>",
              "    {children}",
              "  </label>",
              ");",
            ].join("\n"),
            [
              "}) => (",
              "  <fieldset className={`audio-field${wide ? \" is-wide\" : \"\"}`}>",
              "    <legend>{label}</legend>",
              "    {children}",
              "  </fieldset>",
              ");",
            ].join("\n"),
          );
          replaceOnce(
            "    const cueId = id<\"audio-cue\">(`audio-cue.custom.${index}`);",
            [
              "    const cueId = id<\"audio-cue\">(",
              "      nextStableId(",
              "        \"audio-cue.custom\",",
              "        manifest.cues.map((candidate) => candidate.id),",
              "      ),",
              "    );",
            ].join("\n"),
          );
          replaceOnce(
            [
              "    const index = soundscape.layers.length + 1;",
              "    execute(",
              "      insertSceneLayerCommand(state, {",
              "        id: id<\"audio-scene-layer\">(",
              "          `audio-scene-layer.${state.selectedSceneId}.${index}`,",
              "        ),",
            ].join("\n"),
            [
              "    const layerId = id<\"audio-scene-layer\">(",
              "      nextStableId(",
              "        `audio-scene-layer.${state.selectedSceneId}`,",
              "        soundscape.layers.map((candidate) => candidate.id),",
              "      ),",
              "    );",
              "    execute(",
              "      insertSceneLayerCommand(state, {",
              "        id: layerId,",
            ].join("\n"),
          );
          replaceOnce(
            [
              "    const bindingId = id<\"audio-speech-binding\">(",
              "      `audio-speech-binding.custom.${manifest.speechBindings.length + 1}`,",
              "    );",
            ].join("\n"),
            [
              "    const bindingId = id<\"audio-speech-binding\">(",
              "      nextStableId(",
              "        \"audio-speech-binding.custom\",",
              "        manifest.speechBindings.map((candidate) => candidate.id),",
              "      ),",
              "    );",
            ].join("\n"),
          );
          replaceOnce(
            [
              "    const ruleId = id<\"audio-ducking-rule\">(",
              "      `audio-ducking-rule.custom.${manifest.ducking.length + 1}`,",
              "    );",
            ].join("\n"),
            [
              "    const ruleId = id<\"audio-ducking-rule\">(",
              "      nextStableId(",
              "        \"audio-ducking-rule.custom\",",
              "        manifest.ducking.map((candidate) => candidate.id),",
              "      ),",
              "    );",
            ].join("\n"),
          );
          replaceOnce(
            [
              "  const replace = (next: AudioCue, notice: string): void =>",
              "    execute(replaceSelectedAudioCueCommand(state, next), notice);",
              "",
              "  return (",
            ].join("\n"),
            [
              "  const replace = (next: AudioCue, notice: string): void =>",
              "    execute(replaceSelectedAudioCueCommand(state, next), notice);",
              "  const loop = cue?.loop ?? null;",
              "",
              "  return (",
            ].join("\n"),
          );
          replaceOnce("                checked={cue.loop !== null}\n", "                checked={loop !== null}\n                disabled={cue.bus === \"speech\"}\n");
          replaceOnce("            {cue.loop ? (\n", "            {loop ? (\n");
          source = source.replaceAll("value={cue.loop.", "value={loop.");
          const assertionCount = source.split("...cue.loop!").length - 1;
          if (assertionCount !== 3) {
            throw new Error(`Expected three loop assertions, found ${assertionCount}.`);
          }
          source = source.replaceAll("...cue.loop!", "...loop");
          fs.writeFileSync(path, source);

          const cssPath = "apps/studio/src/audio.css";
          let css = fs.readFileSync(cssPath, "utf8");
          const oldFieldCss = [
            ".audio-field {",
            "  display: grid;",
            "  min-width: 0;",
            "  gap: 5px;",
            "}",
            "",
            ".audio-field > span {",
          ].join("\n");
          const newFieldCss = [
            ".audio-field {",
            "  display: grid;",
            "  min-width: 0;",
            "  min-inline-size: 0;",
            "  gap: 5px;",
            "  margin: 0;",
            "  padding: 0;",
            "  border: 0;",
            "}",
            "",
            ".audio-field > legend {",
          ].join("\n");
          if (!css.includes(oldFieldCss)) {
            throw new Error("Expected audio field CSS fragment is missing.");
          }
          css = css.replace(oldFieldCss, newFieldCss);
          fs.writeFileSync(cssPath, css);
          NODE

      - name: Install exact committed dependency graph
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        run: >-
          pnpm exec biome check --write
          apps/studio/src/AudioApp.tsx
          apps/studio/src/audio.css

      - name: Verify repository lint
        run: pnpm exec biome ci .

      - name: Run governed editor expansion gate
        run: pnpm run check:editor-expansion

      - name: Commit verified Audio Studio hardening
        shell: bash
        run: |
          if git diff --quiet -- apps/studio/src/AudioApp.tsx apps/studio/src/audio.css; then
            echo "Audio Studio source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/AudioApp.tsx apps/studio/src/audio.css
          git commit -m "fix: harden verified Audio Studio authoring"
          git push origin HEAD:main
