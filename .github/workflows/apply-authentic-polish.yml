name: Apply authentic classic adventure polish

on:
  push:
    branches:
      - agent/authentic-classic-polish-20260809

concurrency:
  group: authentic-classic-polish-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  BASE_SHA: 395f76e094fdd5965a738cdc00c16d692f55bf7a
  BRANCH_NAME: agent/authentic-classic-polish-20260809
  BUNDLE_SHA256: 8e9474609f03128e2b6399931c566a5ce6377361e520b9927321c37c72e2010b

jobs:
  apply-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out guarded branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify guarded staging tree
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort > /tmp/staged-actual.txt
          cat > /tmp/staged-expected.txt <<'EOF'
          .agent-release/part-00
          .agent-release/part-01
          .agent-release/part-02
          .agent-release/part-03
          .agent-release/part-04
          .agent-release/part-05
          .agent-release/part-06
          .agent-release/part-07
          .agent-release/part-08
          .github/workflows/apply-authentic-polish.yml
          EOF
          diff -u /tmp/staged-expected.txt /tmp/staged-actual.txt

      - name: Reconstruct sealed source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-release/part-* | base64 --decode > /tmp/authentic-polish.tar.xz
          echo "$BUNDLE_SHA256  /tmp/authentic-polish.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/authentic-polish
          tar -xJf /tmp/authentic-polish.tar.xz -C /tmp/authentic-polish
          test -f /tmp/authentic-polish/authentic-polish-bundle-lite/APPLY_AUTHENTIC_POLISH.mjs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic pixel-art dependency
        run: python3 -m pip install --disable-pip-version-check --no-input Pillow==12.3.0

      - name: Apply sealed source and regenerate indexed assets
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/authentic-polish/authentic-polish-bundle-lite/APPLY_AUTHENTIC_POLISH.mjs \
            /tmp/authentic-polish/authentic-polish-bundle-lite \
            . | tee /tmp/authentic-polish-apply.log
          test -s /tmp/authentic-polish-paths.txt
          test -s /tmp/authentic-polish-text-paths.txt
          test -s /tmp/authentic-polish-biome-paths.txt
          grep -F '"changedPaths": 55' /tmp/authentic-polish-apply.log
          grep -F '"indexedAssets": 17' /tmp/authentic-polish-apply.log
          LC_ALL=C sort -u /tmp/authentic-polish-paths.txt > /tmp/authentic-polish-expected-paths.txt

      - name: Verify exact applied scope before formatting
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only "$BASE_SHA"; git ls-files --others --exclude-standard; } \
            | LC_ALL=C sort -u > /tmp/authentic-polish-actual-paths.txt
          diff -u /tmp/authentic-polish-expected-paths.txt /tmp/authentic-polish-actual-paths.txt
          test ! -e .agent-release
          test ! -e .github/workflows/apply-authentic-polish.yml

      - name: Apply reviewed source-hygiene fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one guarded source block, found {count}."
                  )
              path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")

          replace_exact(
              "packages/scene-runtime/src/scene-transition.ts",
              "      `Actor '${actor.id}' has no idle or '${actorInstance.animationState}' ` +\n"
              "        \"arrival animation.\",",
              "      `Actor '${actor.id}' has no idle or "
              "'${actorInstance.animationState}' arrival animation.`,",
          )
          replace_exact(
              "apps/player/src/main.ts",
              'import type { ReplayEvent, ReplayLog } from "@evavo/adventure-replay";',
              'import type { ReplayLog } from "@evavo/adventure-replay";',
          )
          replace_exact(
              "packages/runtime-controller/src/packaged-controller.ts",
              "  const submitParserCommand = (input: string): void => {\n"
              '    if (!runtimeSkin || runtimeSkin.interactionMode !== "parser-assisted") {',
              "  const submitParserCommand = (input: string): void => {\n"
              '    if (runtimeSkin?.interactionMode !== "parser-assisted") {',
          )
          replace_exact(
              "packages/runtime-controller/src/packaged-controller.ts",
              "  const handleKey = (input: ParserKeyInput): boolean => {\n"
              '    if (!runtimeSkin || runtimeSkin.interactionMode !== "parser-assisted") {',
              "  const handleKey = (input: ParserKeyInput): boolean => {\n"
              '    if (runtimeSkin?.interactionMode !== "parser-assisted") {',
          )
          replace_exact(
              "packages/scene-runtime/src/index.ts",
              "  const asset = assetsById(bundle).get(scene.backgroundAssetId);\n"
              '  if (!asset || asset.kind !== "image") {',
              "  const asset = assetsById(bundle).get(scene.backgroundAssetId);\n"
              '  if (asset?.kind !== "image") {',
          )
          replace_exact(
              "scripts/validate-red-ledger-runtime.mjs",
              "    const key = JSON.stringify([interaction.verb, interaction.itemId ?? null]);\n"
              "    (interactionIndex[key] ??= []).push(interaction.id);",
              "    const key = JSON.stringify([interaction.verb, interaction.itemId ?? null]);\n"
              "    const interactionIds = interactionIndex[key] ?? [];\n"
              "    interactionIds.push(interaction.id);\n"
              "    interactionIndex[key] = interactionIds;",
          )

          app_path = Path("apps/studio/src/ClassicExperienceApp.tsx")
          app_source = app_path.read_text(encoding="utf-8")
          app_old = '''const principleLabel = (principle: ClassicExperiencePrincipleResult): string =>
            principle.id.replaceAll("-", " ");

          export const ClassicExperienceApp = () => {
            const [projectIndex, setProjectIndex] = useState(1);
            const project =
              classicAdventureCreatorProjects[projectIndex] ??
              classicAdventureCreatorProjects[0]!;
          '''
          app_new = '''const principleLabel = (principle: ClassicExperiencePrincipleResult): string =>
            principle.id.replaceAll("-", " ");

          const defaultClassicAdventureProject = classicAdventureCreatorProjects[0];
          if (!defaultClassicAdventureProject) {
            throw new Error("Classic Experience requires at least one creator project.");
          }

          export const ClassicExperienceApp = () => {
            const [projectIndex, setProjectIndex] = useState(1);
            const project =
              classicAdventureCreatorProjects[projectIndex] ??
              defaultClassicAdventureProject;
          '''
          if app_source.count(app_old) != 1:
              raise SystemExit("ClassicExperienceApp guarded block did not match exactly.")
          app_path.write_text(
              app_source.replace(app_old, app_new),
              encoding="utf-8",
              newline="\n",
          )

          test_path = Path(
              "packages/adventure-design/tests/classic-experience.test.ts"
          )
          test_source = test_path.read_text(encoding="utf-8")
          helper_old = '''const mutable = (
            project: ClassicAdventureCreatorProject,
          ): ClassicAdventureCreatorProject => structuredClone(project);

          '''
          helper_new = '''const mutable = (
            project: ClassicAdventureCreatorProject,
          ): ClassicAdventureCreatorProject => structuredClone(project);

          const mutableProjectAt = (index: number): ClassicAdventureCreatorProject => {
            const project = classicAdventureCreatorProjects[index];
            if (!project) {
              throw new Error(`Classic experience fixture ${index} is missing.`);
            }
            return mutable(project);
          };

          const firstPuzzle = (
            project: ClassicAdventureCreatorProject,
          ): ClassicAdventureCreatorProject["puzzles"][number] => {
            const puzzle = project.puzzles[0];
            if (!puzzle) {
              throw new Error(`Classic experience project '${project.id}' has no puzzle.`);
            }
            return puzzle;
          };

          '''
          if test_source.count(helper_old) != 1:
              raise SystemExit("Classic experience test helper block did not match.")
          test_source = test_source.replace(helper_old, helper_new)
          test_source = test_source.replace(
              "const project = mutable(classicAdventureCreatorProjects[0]!);\n"
              "    const puzzle = project.puzzles[0]!;",
              "const project = mutableProjectAt(0);\n"
              "    const puzzle = firstPuzzle(project);",
          )
          test_source = test_source.replace(
              "const project = mutable(classicAdventureCreatorProjects[1]!);\n"
              "    const puzzle = project.puzzles[0]!;",
              "const project = mutableProjectAt(1);\n"
              "    const puzzle = firstPuzzle(project);",
          )
          if "classicAdventureCreatorProjects[0]!" in test_source:
              raise SystemExit("A creator-project non-null assertion remains.")
          if "project.puzzles[0]!" in test_source:
              raise SystemExit("A puzzle non-null assertion remains.")
          test_path.write_text(test_source, encoding="utf-8", newline="\n")
          print("Applied ten reviewed source-hygiene fixes.")
          PY

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install exact pnpm toolchain and workspace
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.17.0
          node --version
          pnpm --version
          pnpm install --lockfile=false

      - name: Verify pinned repository toolchain
        run: pnpm run check:toolchain

      - name: Format and lint changed source
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t BIOME_PATHS < /tmp/authentic-polish-biome-paths.txt
          set +e
          pnpm exec biome check --write "${BIOME_PATHS[@]}" \
            > /tmp/authentic-polish-biome-write.log 2>&1
          write_status=$?
          set -e
          cat /tmp/authentic-polish-biome-write.log
          if [ "$write_status" -ne 0 ]; then
            echo "::error title=Biome write gate failed::See authentic-polish-biome-write.log."
            exit "$write_status"
          fi
          set +e
          pnpm exec biome check "${BIOME_PATHS[@]}" \
            > /tmp/authentic-polish-biome-check.log 2>&1
          check_status=$?
          set -e
          cat /tmp/authentic-polish-biome-check.log
          if [ "$check_status" -ne 0 ]; then
            echo "::error title=Biome verification gate failed::See authentic-polish-biome-check.log."
            exit "$check_status"
          fi
          git diff --check

      - name: Verify changed text-file hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          paths = [
              Path(line)
              for line in Path("/tmp/authentic-polish-text-paths.txt")
              .read_text(encoding="utf-8")
              .splitlines()
              if line
          ]
          failures: list[str] = []
          for path in paths:
              data = path.read_bytes()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  failures.append(f"{path}: not UTF-8")
                  continue
              if b"\r" in data:
                  failures.append(f"{path}: CR line ending")
              if text and not text.endswith("\n"):
                  failures.append(f"{path}: missing final newline")
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if line.rstrip(" \t") != line:
                      failures.append(f"{path}:{line_number}: trailing whitespace")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Verified {len(paths)} changed text files.")
          PY

      - name: Validate canonical Red Ledger runtime source
        shell: bash
        run: |
          set +e
          node scripts/validate-red-ledger-runtime.mjs \
            > /tmp/authentic-polish-runtime-validation.log 2>&1
          status=$?
          set -e
          cat /tmp/authentic-polish-runtime-validation.log
          exit "$status"

      - name: Build full strict TypeScript graph
        shell: bash
        run: |
          set +e
          pnpm exec tsc -b --pretty false \
            > /tmp/authentic-polish-tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/authentic-polish-tsc.log
          exit "$status"

      - name: Run focused authenticity, runtime, and editor regressions
        shell: bash
        run: |
          set +e
          pnpm exec vitest run \
            packages/adventure-design/tests/classic-experience.test.ts \
            packages/renderer-pixi/tests/pixel-presentation.test.ts \
            packages/project-schema/tests/project-schema.test.ts \
            packages/project-editor-core/tests/project-editor.test.ts \
            packages/scene-runtime/tests/scene-transition.test.ts \
            apps/player/tests/built-in-demos.test.ts \
            apps/player/tests/red-ledger-playable-slice.test.mjs \
            packages/adventure-design/tests/red-ledger-runtime.test.mjs \
            --reporter=verbose \
            > /tmp/authentic-polish-vitest.log 2>&1
          status=$?
          set -e
          cat /tmp/authentic-polish-vitest.log
          exit "$status"

      - name: Build production Player and Studio
        shell: bash
        run: |
          set +e
          pnpm --filter @evavo/adventure-player build \
            > /tmp/authentic-polish-player-build.log 2>&1
          player_status=$?
          pnpm --filter @evavo/adventure-studio-app build \
            > /tmp/authentic-polish-studio-build.log 2>&1
          studio_status=$?
          set -e
          cat /tmp/authentic-polish-player-build.log
          cat /tmp/authentic-polish-studio-build.log
          if [ "$player_status" -ne 0 ]; then exit "$player_status"; fi
          exit "$studio_status"

      - name: Verify final feature scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          { git diff --name-only "$BASE_SHA"; git ls-files --others --exclude-standard; } \
            | LC_ALL=C sort -u > /tmp/authentic-polish-actual-paths.txt
          diff -u /tmp/authentic-polish-expected-paths.txt /tmp/authentic-polish-actual-paths.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: authentic-polish-diagnostics-${{ github.run_number }}
          path: |
            /tmp/authentic-polish-*.log
            /tmp/authentic-polish-actual-paths.txt
            /tmp/authentic-polish-expected-paths.txt
            /tmp/authentic-polish-paths.txt
            /tmp/authentic-polish-biome-paths.txt
            /tmp/authentic-polish-text-paths.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit verified feature to guarded branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO Release Agent"
          git config user.email "release-agent@evavo.com.au"
          git add -A
          git diff --cached --name-only "$BASE_SHA" | LC_ALL=C sort -u \
            > /tmp/authentic-polish-staged-paths.txt
          diff -u /tmp/authentic-polish-expected-paths.txt /tmp/authentic-polish-staged-paths.txt
          git commit -m "feat: add authentic classic adventure polish"
          git push origin "HEAD:$BRANCH_NAME"
